# Только ошибки самого nginx; ответы backend сохраняются без перехвата.
proxy_intercept_errors off;
error_page 400 = @storm_error_400;
error_page 401 = @storm_error_401;
error_page 403 = @storm_error_403;
error_page 404 = @storm_error_404;
error_page 405 = @storm_error_405;
error_page 408 = @storm_error_408;
error_page 413 = @storm_error_413;
error_page 429 = @storm_error_429;
error_page 500 = @storm_error_500;
error_page 502 = @storm_error_502;
error_page 503 = @storm_error_503;
error_page 504 = @storm_error_504;
location @storm_error_400 {
    default_type application/json;
    return 400 '{"detail":"Некорректный запрос.","code":"bad_request","request_id":"$storm_request_id"}';
}
location @storm_error_401 {
    default_type application/json;
    return 401 '{"detail":"Необходимо войти в систему.","code":"unauthorized","request_id":"$storm_request_id"}';
}
location @storm_error_403 {
    default_type application/json;
    return 403 '{"detail":"Недостаточно прав для действия.","code":"forbidden","request_id":"$storm_request_id"}';
}
location @storm_error_404 {
    default_type application/json;
    return 404 '{"detail":"Запрошенный ресурс не найден.","code":"not_found","request_id":"$storm_request_id"}';
}
location @storm_error_405 {
    default_type application/json;
    return 405 '{"detail":"Метод запроса не поддерживается.","code":"method_not_allowed","request_id":"$storm_request_id"}';
}
location @storm_error_408 {
    default_type application/json;
    return 408 '{"detail":"Время ожидания запроса истекло.","code":"request_timeout","request_id":"$storm_request_id"}';
}
location @storm_error_413 {
    default_type application/json;
    return 413 '{"detail":"Размер файла превышает допустимый предел.","code":"payload_too_large","request_id":"$storm_request_id"}';
}
location @storm_error_429 {
    default_type application/json;
    return 429 '{"detail":"Слишком много запросов. Попробуйте позже.","code":"rate_limited","request_id":"$storm_request_id"}';
}
location @storm_error_500 {
    default_type application/json;
    return 500 '{"detail":"Не удалось выполнить действие. Попробуйте позже.","code":"internal_error","request_id":"$storm_request_id"}';
}
location @storm_error_502 {
    default_type application/json;
    return 502 '{"detail":"Сервис временно недоступен. Попробуйте позже.","code":"upstream_error","request_id":"$storm_request_id"}';
}
location @storm_error_503 {
    default_type application/json;
    return 503 '{"detail":"Сервис временно недоступен. Попробуйте позже.","code":"service_unavailable","request_id":"$storm_request_id"}';
}
location @storm_error_504 {
    default_type application/json;
    return 504 '{"detail":"Сервис не ответил вовремя. Попробуйте позже.","code":"upstream_timeout","request_id":"$storm_request_id"}';
}
